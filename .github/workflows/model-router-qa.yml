name: Model router isolated QA
on:
  push:
    branches: [qa/devnet-model-router-v0.4.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile router and tests
        run: python -m compileall -q model-router-qa
      - name: Run isolated unit tests
        working-directory: model-router-qa
        run: python -m unittest discover -v

  ollama-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ollama on isolated CI runner
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama and pull small CPU test model
        run: |
          ollama serve > /tmp/ollama-ci.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then break; fi
            sleep 2
          done
          ollama pull smollm2:135m
      - name: Run real Ollama lifecycle tests
        working-directory: model-router-qa
        run: python -m unittest -v live_ollama_test
