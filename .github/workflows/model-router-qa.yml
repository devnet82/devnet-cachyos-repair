name: Model router isolated QA
on:
  push:
    branches: [qa/devnet-model-router-v0.4.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile router and tests
        run: python -m compileall -q model-router-qa
      - name: Run isolated unit tests
        working-directory: model-router-qa
        run: python -m unittest discover -v
