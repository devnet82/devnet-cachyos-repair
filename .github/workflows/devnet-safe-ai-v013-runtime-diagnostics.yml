name: Devnet Safe AI v013 runtime compatibility diagnostics - no release
on:
  push:
    branches: [qa/devnet-safe-ai-v0.1.3-reasoning-fix]
    paths: ['.github/workflows/devnet-safe-ai-v013-runtime-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-exact-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Inspect exact v013 archive entrypoints without installing anything
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '8a55f4dbc9e939b04b798b7176ed8ab10b0439a88fc7609f134b528d1d3daf7b  qa/devnet-safe-ai-v0.1.3/candidate.zip' | sha256sum -c -
          mkdir -p /tmp/devnet-v013-diag
          unzip -qq qa/devnet-safe-ai-v0.1.3/candidate.zip -d /tmp/devnet-v013-diag
          cd /tmp/devnet-v013-diag
          python3 test_devnet_safe_ai_v0.1.3.py 2>&1 | tee /tmp/devnet-35-tests.log
          grep -q 'Ran 35 tests' /tmp/devnet-35-tests.log
          echo '=== Python main entrypoints and callable APIs ==='
          python3 - <<'PY'
          import ast
          p=ast.parse(open('devnet-safe-ai-v0.1.3.py').read())
          for n in p.body:
              if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef)):
                  print(n.lineno,type(n).__name__,n.name)
          PY
          echo '=== README (first 160 lines) ==='
          sed -n '1,160p' DEVNET-SAFE-AI-v0.1.3-README.md
          echo '=== Bounded config and CLI sections ==='
          grep -nE 'argparse|if __name__|def (main|run|doctor|install|runtime)|opencode run|open_code|model.*(30|9)|OLLAMA|bwrap' devnet-safe-ai-v0.1.3.py | head -n 100
          echo 'INVENTORY_ONLY_NO_LIVE_OPENAI_OR_OLLAMA_NO_INSTALL'
