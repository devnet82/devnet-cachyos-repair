name: Devnet Consolidated Master QA v0.1.7 - eight apps, fail closed
on:
  push:
    branches:
      - qa/devnet-master-consolidated-v0.1.7
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  qa-gate-self-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax, integrity and fail-closed regression suite
        run: |
          set -Eeuo pipefail
          python3 -m py_compile qa/master-v0.1.7/gate.py qa/master-v0.1.7/test_gate.py
          python3 -m json.tool qa/master-v0.1.7/candidates.json >/dev/null
          python3 -m unittest discover -s qa/master-v0.1.7 -p 'test_gate.py' -v
  mandatory-eight-app-release-gate:
    needs: qa-gate-self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check original GRUB/BTRFS installed-system rollback evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/repair/platform
          if gh run download 38083265759 --repo devnet82/devnet-cachyos-repair \
             --name cachyos-installed-grub-btrfs-qa-v0.1.19 \
             --dir evidence/repair/platform; then
            echo "ORIGINAL_INSTALLED_GRUB_BTRFS_EVIDENCE_DOWNLOADED"
          else
            echo "NOT_TESTED: historical installed-system artifact unavailable"
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          folder=Path("evidence/repair/platform")
          conditions={
            "first_installed_boot":("installed-first-pass.txt","INSTALLED_GRUB_BTRFS_FIRST_BOOT_PASS"),
            "snapshot_restore_prepared":("restore-grub-prepared.txt","BTRFS_RESTORED_ENTRY_WRITTEN"),
            "restored_installed_reboot":("installed-restored-pass.txt","INSTALLED_GRUB_BTRFS_REBOOT_ROLLBACK_PASS")}
          result={}
          for key,(name,marker) in conditions.items():
              p=folder/name
              result[key]="PASS" if p.is_file() and marker in p.read_text(errors="replace") else "NOT_TESTED"
          status="PASS" if all(v=="PASS" for v in result.values()) else "NOT_TESTED"
          (folder/"platform-baseline-v0.1.7.json").write_text(json.dumps({
              "source_run_id":38083265759,"platform_grub_btrfs_status":status,
              "checks":result,"app_clean_install":"NOT_TESTED",
              "hardware_acceptance":"NOT_TESTED"},indent=2)+"\n")
          print("INSTALLED_GRUB_BTRFS_PLATFORM_BASELINE_"+status)
          PY
      - name: Strict consolidated eight-application release decision
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/reports
          python3 qa/master-v0.1.7/gate.py \
            --manifest qa/master-v0.1.7/candidates.json \
            --evidence-root evidence \
            --output evidence/reports/master-qa-v0.1.7.json
      - name: Preserve consolidated results even when release gate correctly blocks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devnet-master-qa-v0.1.7-eight-app-release-gate
          path: |
            evidence/reports/
            evidence/repair/platform/platform-baseline-v0.1.7.json
          retention-days: 30
          if-no-files-found: warn
