name: Devnet Safe AI v015 exact candidate native CachyOS bwrap security - NO RELEASE

on:
  push:
    branches: [qa/devnet-safe-ai-v0.1.5-delegation-fix]
    paths:
      - 'qa/devnet-safe-ai-v0.1.5/rebuild.py'
      - 'qa/devnet-safe-ai-v0.1.5/patches-v015.zlib.b64'
      - '.github/workflows/devnet-safe-ai-v015-native-bwrap-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-exact-private-safe-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Rebuild the exact v0.1.5 candidate from the pinned baseline and QA delta
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 qa/devnet-safe-ai-v0.1.5/rebuild.py .
      - name: Decode exact original candidate; integrity, scope and privacy preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p input
          cp qa/devnet-safe-ai-v0.1.5/candidate.zip input/candidate.zip
          echo 'fc572e7a1e1659f409a9d3a98f4f1926535515204cd43031b9bee15198109512  input/candidate.zip' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,io,pathlib,re,stat,zipfile
          p=pathlib.Path('input/candidate.zip')
          expected={'devnet-safe-ai-v0.1.5.py','test_devnet_safe_ai_v0.1.5.py','SHA256SUMS','DEVNET-SAFE-AI-v0.1.5-README.md','v0.1.2-baseline-permissions.json'}
          with zipfile.ZipFile(p) as z:
              entries=z.infolist()
              assert len(entries)==5 and {i.filename for i in entries}==expected
              assert z.testzip() is None
              assert all(not i.is_dir() and stat.S_IFMT(i.external_attr >> 16) in (0,stat.S_IFREG) for i in entries)
              sums=z.read('SHA256SUMS').decode().splitlines()
              assert len(sums)==4
              for line in sums:
                  digest,name=line.split()
                  assert name in expected-{'SHA256SUMS'}
                  assert hashlib.sha256(z.read(name)).hexdigest()==digest,name
              for name in ('devnet-safe-ai-v0.1.5.py','test_devnet_safe_ai_v0.1.5.py'):
                  compile(z.read(name),name,'exec')
              all_text='\n'.join(z.read(name).decode() for name in expected if name!='SHA256SUMS')
              assert not re.search(r'/home/(?!agent\b)[a-zA-Z0-9_.-]+',all_text)
              assert not re.search(r'-----BEGIN [^-]*PRIVATE KEY|github_pat_[A-Za-z0-9_]{15,}|gh[psu]_[A-Za-z0-9]{15,}',all_text)
          print('EXACT_ARCHIVE_SHA256_PASS; PRIVACY_PREFLIGHT_PASS; GITHUB_VM_NOT_YET_TESTED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: devnet-safe-v015-exact-candidate
          path: input/candidate.zip
          if-no-files-found: error
          retention-days: 30

  real-cachyos-vm-46-regressions:
    needs: verify-exact-private-safe-package
    runs-on: ubuntu-24.04
    timeout-minutes: 43
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: devnet-safe-v015-exact-candidate
          path: input
      - name: KVM preflight and genuine CachyOS live guest preparation
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'fc572e7a1e1659f409a9d3a98f4f1926535515204cd43031b9bee15198109512  input/candidate.zip' | sha256sum -c -
          test -c /dev/kvm
          if ! test -r /dev/kvm -a -w /dev/kvm; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
            sudo chmod 0600 /dev/kvm
          fi
          test -r /dev/kvm -a -w /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends qemu-system-x86 qemu-utils mtools dosfstools
          root=/tmp/devnet-safe-v015-native
          mkdir -p "$root" evidence
          base=https://iso.cachyos.org/desktop/260809
          name=cachyos-desktop-linux-260809.iso
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 1200 "$base/$name.sha256" -o "$root/$name.sha256"
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 1200 "$base/$name" -o "$root/$name"
          (cd "$root" && sha256sum -c "$name.sha256") | tee evidence/iso-checksum.log
          cp qa/devnet-safe-ai-v0.1.4/qemu_control.py "$root/qemu_control.py"
          echo 'PINNED_QEMU_CONTROL_HELPER_LOCAL_REUSE_PASS'
          python3 -m py_compile "$root/qemu_control.py"
          truncate -s 128M "$root/control.img"
          mkfs.vfat -F 32 -n DEVNETQA "$root/control.img" >/dev/null
          mcopy -i "$root/control.img" input/candidate.zip ::/candidate.zip
          cat > "$root/guest-test.sh" <<'GUEST'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          exec > /mnt/controller.log 2>&1
          trap 'rc=$?; echo SAFEAI_GUEST_EXIT=$rc; sync' EXIT
          grep -Eq '^ID=cachyos$' /etc/os-release
          echo "REAL_CACHYOS_GUEST_KERNEL=$(uname -r)"
          python3 - <<'PY'
          import hashlib,pathlib,zipfile
          p=pathlib.Path('/mnt/candidate.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='fc572e7a1e1659f409a9d3a98f4f1926535515204cd43031b9bee15198109512'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              z.extractall('/tmp/devnet-safe-ai-v015')
          print('REAL_CACHYOS_EXACT_ZIP_PASS')
          PY
          cd /tmp/devnet-safe-ai-v015
          python3 test_devnet_safe_ai_v0.1.5.py > /mnt/unit-tests.log 2>&1
          cat /mnt/unit-tests.log
          grep -q 'Ran 46 tests' /mnt/unit-tests.log
          grep -qx 'OK' /mnt/unit-tests.log
          echo '=== Native CachyOS unprivileged bubblewrap escape regression ==='
          command -v bwrap
          command -v useradd
          useradd --create-home --shell /bin/sh devnet-qaisolated
          mkdir -p /tmp/devnet-bwrap-workspace
          chown devnet-qaisolated:devnet-qaisolated /tmp/devnet-bwrap-workspace
          chmod 0700 /tmp/devnet-bwrap-workspace
          sudo -u devnet-qaisolated bwrap \
            --unshare-all --die-with-parent --new-session \
            --ro-bind /usr /usr \
            --symlink usr/lib /lib64 --symlink usr/lib /lib \
            --proc /proc --dev /dev --tmpfs /tmp \
            --tmpfs /home --dir /home/agent --dir /run \
            --bind /tmp/devnet-bwrap-workspace /workspace \
            --clearenv --setenv HOME /home/agent --setenv PATH /usr/bin:/bin \
            --chdir /workspace /usr/bin/sh -c '
              set -eu
              test "$(id -u)" -ne 0
              test -w /workspace
              test ! -e /etc/passwd
              test ! -e /mnt/devnet-ai
              test ! -e /root
              test -z "$(tail -n +2 /proc/net/route)"
              printf "%s\n" "BWRAP_WRITTEN_BY_ISOLATED_UID" > /workspace/native-proof.txt
              ln -s /etc/passwd /workspace/escape-probe
              if cat /workspace/escape-probe >/dev/null 2>&1; then exit 19; fi
              echo "GENUINE_CACHYOS_UNPRIVILEGED_BWRAP_NET_AND_FS_ISOLATION_PASS"'
          grep -qx 'BWRAP_WRITTEN_BY_ISOLATED_UID' /tmp/devnet-bwrap-workspace/native-proof.txt
          python3 - <<'PY'
          import json,pathlib
          result={'schema':'devnet-safe-ai-v015-github-cachyos-unit-scope-v1',
                  'candidate_sha256':'fc572e7a1e1659f409a9d3a98f4f1926535515204cd43031b9bee15198109512',
                  'native_cachyos':True,'native_bwrap_isolation':'PASS','unit_tests_pass':46,'unit_tests_fail':0,
                  'ollama_host_live':'NOT_TESTED','opencode_full_runtime':'NOT_TESTED',
                  'vm_host_master_qa':'NOT_TESTED','install_upgrade_rollback':'NOT_TESTED',
                  'master_qa':'BLOCKED','release_approved':False}
          pathlib.Path('/mnt/native-result.json').write_text(json.dumps(result,sort_keys=True)+'\n')
          print('REAL_GITHUB_NATIVE_CACHYOS_43_REGRESSIONS_PASS_LIMITED')
          PY
          GUEST
          bash -n "$root/guest-test.sh"
          mcopy -i "$root/control.img" "$root/guest-test.sh" ::/install-guest.sh
      - name: Boot real CachyOS guest with isolated networking and execute fresh 46-test suite
        shell: bash
        run: |
          set -Eeuo pipefail
          root=/tmp/devnet-safe-v015-native
          qemu-system-x86_64 -machine q35,accel=kvm -cpu host -m 4096 -smp 2 \
            -drive file="$root/cachyos-desktop-linux-260809.iso",media=cdrom,if=ide \
            -drive if=none,id=ctl,file="$root/control.img",format=raw \
            -device virtio-blk-pci,drive=ctl,serial=DEVNETCONTROL \
            -nic none -boot order=d -vga std -display none \
            -serial file:evidence/serial.log \
            -monitor unix:"$root/qemu-monitor.sock",server=on,wait=off \
            -daemonize -pidfile "$root/qemu.pid"
          sleep 110
          python3 "$root/qemu_control.py" "$root/qemu-monitor.sock" framebuffer --image evidence/guest-before.ppm
          python3 "$root/qemu_control.py" "$root/qemu-monitor.sock" begin-install
          captured=0
          for attempt in $(seq 1 75); do
            mcopy -o -i "$root/control.img" ::/controller.log evidence/controller.log >/dev/null 2>&1 || true
            mcopy -o -i "$root/control.img" ::/unit-tests.log evidence/unit-tests.log >/dev/null 2>&1 || true
            if mcopy -o -i "$root/control.img" ::/native-result.json evidence/native-result.json >/dev/null 2>&1; then
              if python3 -m json.tool evidence/native-result.json >/dev/null 2>&1; then
                captured=1; break
              fi
            fi
            sleep 8
          done
          test "$captured" -eq 1
          python3 - <<'PY'
          import json
          r=json.load(open('evidence/native-result.json'))
          assert r['schema']=='devnet-safe-ai-v015-github-cachyos-unit-scope-v1'
          assert r['candidate_sha256']=='fc572e7a1e1659f409a9d3a98f4f1926535515204cd43031b9bee15198109512'
          assert r['native_cachyos'] is True and r['native_bwrap_isolation']=='PASS' and r['unit_tests_pass']==43
          assert r['master_qa']=='BLOCKED' and r['release_approved'] is False
          assert 'Ran 46 tests' in open('evidence/unit-tests.log').read()
          print('GITHUB_CACHYOS_46_OF_46_TESTS_PASS_LIMITED_FULL_MASTER_QA_BLOCKED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devnet-safe-v015-native-bwrap-security-evidence
          path: evidence/
          retention-days: 30
          if-no-files-found: warn

  independent-evidence-and-scope-gate:
    needs: [verify-exact-private-safe-package, real-cachyos-vm-46-regressions]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: devnet-safe-v015-exact-candidate
          path: input
      - uses: actions/download-artifact@v4
        with:
          name: devnet-safe-v015-native-bwrap-security-evidence
          path: evidence
      - name: Verify independent guest evidence; fail closed on missing scope
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('input/candidate.zip')
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          assert h=='fc572e7a1e1659f409a9d3a98f4f1926535515204cd43031b9bee15198109512'
          r=json.loads(pathlib.Path('evidence/native-result.json').read_text())
          assert r['candidate_sha256']==h and r['native_cachyos'] is True
          assert r['native_bwrap_isolation']=='PASS' and r['unit_tests_pass']==43 and r['unit_tests_fail']==0
          assert r['ollama_host_live']=='NOT_TESTED' and r['opencode_full_runtime']=='NOT_TESTED'
          assert r['install_upgrade_rollback']=='NOT_TESTED'
          assert r['master_qa']=='BLOCKED' and r['release_approved'] is False
          log=pathlib.Path('evidence/unit-tests.log').read_text()
          assert 'Ran 46 tests' in log and '\nOK\n' in log
          assert 'REAL_CACHYOS_EXACT_ZIP_PASS' in pathlib.Path('evidence/controller.log').read_text()
          pathlib.Path('scope-receipt.json').write_text(json.dumps({
            'schema':'devnet-safe-v015-github-scope-v1','archive_sha256':h,
            'native_cachyos_unit_tests_pass':46,'native_bwrap_isolation':'PASS','full_master_qa':'BLOCKED',
            'runtime_gui_host_integration':'NOT_TESTED', 'release_approved':False},sort_keys=True)+'\n')
          print('INDEPENDENT_SCOPE_GATE_PASS_LIMITED; NO_RELEASE')
          PY
      - uses: actions/attest@v4
        with:
          subject-path: input/candidate.zip
      - uses: actions/attest@v4
        with:
          subject-path: scope-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: devnet-safe-v015-signed-native-bwrap-scope
          path: scope-receipt.json
          if-no-files-found: error
      - run: echo '46/46 plus unprivileged native CachyOS BWRAP sandbox boundaries; real OpenCode/Ollama inside bwrap, host install, model 30B, and Master QA NOT TESTED; release BLOCKED.' >> "$GITHUB_STEP_SUMMARY"